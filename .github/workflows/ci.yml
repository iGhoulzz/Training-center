name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-runs. GitHub silently created no run at all for one push on this
  # branch — the workflow was active and every other push triggered one — which
  # left a commit with no checks and no way to ask for them. A gate you cannot
  # re-run on demand is one you end up trusting a stale result from.
  workflow_dispatch:

concurrency:
  # One run per ref. A superseded push has nothing useful left to say.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    # THE TESTING ENVIRONMENT IS ESTABLISHED BEFORE COMPOSER RUNS.
    #
    # A clean checkout has no .env, and `composer install` triggers package
    # discovery, which boots Laravel. Without APP_KEY and the database
    # credentials already present that boot can fail — and `artisan key:generate`
    # cannot be used to supply them, because artisan needs the autoloader
    # Composer has not written yet. Job-level env is the only ordering that
    # works.
    env:
      APP_ENV: testing
      # Non-secret and deliberately obvious: 32 zero bytes. CI must never hold a
      # real key, and a fixed one keeps runs reproducible.
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      # NOT training_center_test. That name belongs to the developer machine,
      # where tests/bootstrap.php generates a database per checkout from it. Set
      # here as a real environment variable, which PHPUnit's <env> does not
      # override and which the bootstrap treats as a deliberate selection and
      # leaves alone. CI gets its own database on its own server, so the two can
      # never interact.
      DB_DATABASE: training_center_ci
      DB_USERNAME: root
      DB_PASSWORD: root
      # The backup config validates its alert address at boot, and
      # `composer install` boots Laravel through package:discover. Without a
      # valid address here the whole install step fails with "backups@localhost
      # is not a valid email address" — which is the config guard doing its job,
      # not a CI bug. Found on this workflow's first real run.
      BACKUP_ALERT_EMAIL: ci@example.com
      HORIZON_ALERT_EMAIL: ci@example.com
      MAIL_FROM_ADDRESS: ci@example.com

    steps:
      - uses: actions/checkout@v4

      # MYSQL AND REDIS ARE STARTED HERE, NOT AS `services:`, SO THEIR PULL CAN
      # FALL BACK (2026-10-19).
      #
      # - Every anonymous registry caps what one IP may pull, and GitHub's
      #   hosted runners share their IPs, so other people's jobs spend the
      #   quota and a run fails with `toomanyrequests` before a test runs.
      # - That happened on Docker Hub first: five runs on 2026-10-09, after which
      #   CI moved to AWS's public mirror. Then it happened there ("Data limit
      #   exceeded"): main and three PRs between 2026-10-13 and 2026-10-19.
      # - A `services:` image comes from one registry with no fallback, so this
      #   step pulls each image from three registries with separate limits:
      #   AWS's mirror, Google's mirror, then Docker Hub. It retries the whole
      #   list with growing waits before failing.
      # - They are the same images: the content digests of mysql:8.4 and
      #   redis:8-alpine were identical on all three when this was written.
      # - The containers, ports, credentials and health checks are the ones the
      #   services block had, and the step waits until both report healthy.
      - name: Start MySQL and Redis (pulled with registry fallback)
        run: |
          pull() {
            local image="$1"
            for attempt in 1 2 3 4; do
              for registry in public.ecr.aws/docker/library mirror.gcr.io/library docker.io/library; do
                if docker pull --quiet "$registry/$image" > /dev/null 2>&1; then
                  docker tag "$registry/$image" "ci-$image"
                  echo "Pulled $image from $registry"
                  return 0
                fi
                echo "::warning::Could not pull $image from $registry (attempt $attempt)"
              done
              sleep $((attempt * 15))
            done
            echo "::error::Could not pull $image from any registry"
            return 1
          }

          healthy() {
            local name="$1"
            for second in $(seq 1 90); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = "healthy" ]; then
                echo "$name is healthy"
                return 0
              fi
              sleep 2
            done
            docker logs "$name" | tail -n 40
            echo "::error::$name did not become healthy"
            return 1
          }

          pull mysql:8.4
          pull redis:8-alpine

          docker run --detach --name mysql \
            --env MYSQL_ROOT_PASSWORD=root --env MYSQL_DATABASE=training_center_ci \
            --publish 3306:3306 \
            --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" \
            --health-interval=5s --health-timeout=5s --health-retries=30 \
            ci-mysql:8.4
          docker run --detach --name redis \
            --publish 6379:6379 \
            --health-cmd="redis-cli ping" \
            --health-interval=5s --health-timeout=5s --health-retries=30 \
            ci-redis:8-alpine

          healthy mysql
          healthy redis

      # AN EMPTY .env, PURELY SO ONE EXISTS.
      #
      # Configuration still comes from the job-level env above, and Laravel
      # loads .env immutably, so a real environment variable always wins over a
      # file entry. This file is empty and is meant to stay that way — it is not
      # a place to configure CI.
      #
      # What it fixes: phpdotenv reads the file with `@file_get_contents()`
      # (vendor/vlucas/phpdotenv/src/Store/File/Reader.php:73) and handles the
      # false return itself, so a missing .env is harmless AT RUNTIME. Under
      # PHPUnit it is not harmless: PHPUnit's error handler does not honour the
      # `@` suppression operator, so every application boot became a test
      # warning. That is one boot per test — 1347 of 1407 tests on this
      # workflow, against 0 locally, where a .env exists.
      #
      # The suite reported "success" throughout, because warnings do not fail a
      # run by default. `failOnWarning` in phpunit.xml now closes that half; this
      # step closes the other, by removing the warning rather than tolerating it.
      - name: Create an empty .env
        run: touch .env

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The current patched 8.4, not the 8.4.1 floor in composer.json's
          # platform config. That floor exists to pin dependency resolution;
          # pinning CI to it would test an old patch release nobody runs.
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip, intl, bcmath, gd, redis
          coverage: none
          tools: composer:v2

      - name: Confirm the Horizon platform extensions
        run: |
          php -r 'foreach (["redis", "pcntl", "posix"] as $extension) { if (! extension_loaded($extension)) { fwrite(STDERR, "Missing required PHP extension: {$extension}\n"); exit(1); } }'

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit the locked dependencies
        # --locked audits what is actually pinned, not what the constraints would
        # allow today. The guzzle advisories that preceded this work were found
        # exactly this way.
        run: composer audit --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit the locked JavaScript dependencies
        # The missing half of `composer audit --locked` above. `npm ci` installs
        # exactly what package-lock.json pins, so this audits the tree that was
        # actually built, not what the ranges in package.json would allow today.
        #
        # HIGH AND CRITICAL FAIL; moderate and low do not. Every JavaScript
        # dependency here is build tooling — Vite, Tailwind, and what they pull in
        # — and none of it is served to a user: `npm run build` emits compiled
        # assets and node_modules never reaches the VPS. Failing on a moderate
        # advisory in a dev-only package would stop unrelated work for an exposure
        # that ends at this runner. High and above is worth the interruption.
        #
        # WHEN AN ADVISORY HAS NO FIX YET, the answer is a decision, not a quieter
        # threshold: take the update if one exists, and if none does, say here why
        # the exposure is acceptable and when to look again. Lowering this line to
        # make a build green is how an audit becomes decoration.
        run: npm audit --audit-level=high

      - name: Verify
        # ONE COMMAND, and deliberately not a restatement of Pint, PHPStan and
        # Pest as separate steps. Listing them here would create a second
        # definition of the gate, free to drift from the one the agents and the
        # Git hooks use — which is the failure this whole task exists to remove.
        #
        # `composer verify` runs the suite in parallel, one process per CPU (four on
        # this runner), each worker on a database of its own. Serial, this step took
        # about 34 minutes. The `load-tooling` group is excluded from it and runs
        # in its own step below, only when the tooling it covers changed.
        run: composer verify

      - name: Confirm a checkout resolves and creates its own test database
        # THE ONE PATH THE GATE ABOVE CANNOT REACH.
        #
        # CI selects DB_DATABASE deliberately, and tests/bootstrap.php leaves a
        # deliberate selection alone — correctly, or CI would run against a
        # database nothing provisioned. So the generate-create-rewrite path that
        # every developer checkout depends on is exercised nowhere in CI, and a
        # regression in it would reach main with this workflow green.
        #
        # `env -u` unsets the variable for this step only, so phpunit.xml's pinned
        # value applies, the bootstrap generates a name from this checkout's path,
        # creates that database on CI's own MySQL, and the test then asserts the
        # application really is connected to it and holds its lock.
        run: env -u DB_DATABASE php artisan test tests/Feature/Tooling/TestDatabaseConnectionTest.php

      - name: Detect changes to the load tooling
        # THE LOAD-TOOLING TESTS ARE OUT OF THE GATE ABOVE, AND RUN HERE INSTEAD.
        #
        # SeedPerformanceDatasetCommandTest and LoadTestSessionsCommandTest drop and
        # rebuild whole schemas and start child processes, which is minutes of the
        # suite for code that changes rarely. `composer verify` excludes their
        # `load-tooling` group; this step decides whether the tooling they cover
        # changed, and the next one runs them if so.
        #
        # A pull request is diffed against the base branch it targets. Everything
        # else — a push to main, a manual run — runs the group unconditionally, so
        # nothing reaches main without having been through it.
        id: load_tooling
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: the load-tooling group always runs."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only FETCH_HEAD HEAD)
          echo "$changed"

          # The seeder writes rows with raw inserts, so the schema it writes into is a
          # dependency as real as its own source: a migration, or an enum or the
          # reference format it writes, can break it without touching it.
          pattern='^(app/Console/Commands/(SeedPerformanceDatasetCommand|MintLoadTestSessionsCommand|RevokeLoadTestSessionsCommand)\.php|app/Support/PerformanceDatabaseGuard\.php|app/Domain/(Enrollment|Finance)/Enums/.*|app/Domain/Finance/Support/Reference\.php|config/performance\.php|database/migrations/.*|database/seeders/.*Performance.*|scripts/Tooling/.*|tests/Feature/Tooling/(SeedPerformanceDatasetCommandTest|LoadTestSessionsCommandTest)\.php)$'

          if echo "$changed" | grep -Eq "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The load tooling changed: running the load-tooling group."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The load tooling is untouched: skipping the load-tooling group."
          fi

      - name: Run the load-tooling tests
        if: steps.load_tooling.outputs.run == 'true'
        run: php artisan test --group=load-tooling

      - name: Build frontend assets
        # Always, never conditional on the diff. A detector would have to parse
        # the pushed refs to be correct, and this build costs seconds against a
        # five-minute suite.
        run: npm run build

      - name: Confirm the production install resolves
        # In a throwaway copy: --no-dev in place would delete Pint, PHPStan and
        # Pest, and every gate above depends on them.
        run: |
          mkdir -p /tmp/prod-check
          cp composer.json composer.lock /tmp/prod-check/
          cd /tmp/prod-check
          composer install --no-dev --no-interaction --no-scripts --no-progress
          if [ -d vendor/laravel/boost ]; then
            echo "laravel/boost must not be installed without dev dependencies"
            exit 1
          fi
          echo "production install is clean and Boost is dev-only"
