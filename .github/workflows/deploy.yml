name: Deploy

# A DELIBERATE, APPROVED RELEASE OF ONE GREEN COMMIT ON main. NOTHING ELSE.
#
# - It starts only by hand. No push, no pull request, no timer and no other
#   workflow can start it, so a merge never reaches production by itself.
# - The `guard` job refuses any ref but main, takes the SHA of the dispatching
#   commit, and requires CI's `verify` job to have succeeded for exactly that
#   SHA on main. A missing, pending, failed or cancelled run all stop here,
#   before anything is built and long before any connection is made.
# - The `build` job runs on an ephemeral runner with no secrets and outside the
#   production environment. It builds THAT SHA, not whatever main has become,
#   and hands the archive to the deploy job as an artifact.
# - The `deploy` job is the only one that touches a credential. It waits for the
#   protected `production` environment's approval, runs one at a time, checks
#   once more that main still points at the SHA, and then makes ONE ssh call
#   that streams the archive on stdin. The key behind it can run a single forced
#   command on the host (deploy/receive.sh) and nothing else.
#
# What the owner configures on GitHub (Task 4, not code): the `production`
# environment with required reviewers and a main-only deployment branch rule;
# the environment secrets PROD_SSH_KEY, PROD_SSH_USER, PROD_SSH_HOST and
# PROD_SSH_PORT; and the environment VARIABLE PROD_SSH_KNOWN_HOSTS holding the
# host's public key lines (`[host]:port` form when the port is not 22).

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lists CI's workflow runs and their jobs. Nothing more.
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Refuse any ref but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys start from refs/heads/main only (this run is on '$REF')."
            exit 1
          fi

      - name: Resolve the exact SHA
        id: resolve
        env:
          SHA: ${{ github.sha }}
        run: |
          # The commit this dispatch runs on, and nothing derived later: a
          # branch name would drift if main moved while the run waited.
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a full lowercase 40-character commit SHA."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Require a green CI run for that SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # `status=success` already narrows the list; the filter below does not
          # trust that, and checks the SHA, the branch, the conclusion and the
          # trigger again. A pull-request run can carry a head branch called
          # "main", so only a push to main or a manual run of CI counts.
          runs_url="repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=main&status=success&per_page=100"
          run_id=$(gh api "$runs_url" --jq '.workflow_runs[] | select(.head_sha == "'"$SHA"'" and .head_branch == "main" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch")) | .id' | sed -n '1p')
          if [ -z "$run_id" ]; then
            echo "::error::No successful ci.yml run exists for $SHA on main. Wait for CI to finish green, or re-run it, then dispatch again."
            exit 1
          fi
          verified=$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100" --jq '[.jobs[] | select(.name == "verify" and .conclusion == "success")] | length')
          if [ "${verified:-0}" -lt 1 ]; then
            echo "::error::CI run $run_id has no successful verify job."
            exit 1
          fi
          echo "CI run $run_id verified $SHA."

  build:
    name: build
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # NOT A PRODUCTION BOOT. `composer install` boots Laravel through package
    # discovery, so the application needs an environment that is valid and
    # disposable: testing, an in-memory cache, session and queue (nothing here
    # may reach a database or Redis), and addresses that satisfy the config
    # guards (see ci.yml for the failure each one prevents). The real .env
    # lives on the host and never enters this job or the archive.
    env:
      SHA: ${{ needs.guard.outputs.sha }}
      APP_ENV: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      BACKUP_ALERT_EMAIL: deploy-build@example.com
      HORIZON_ALERT_EMAIL: deploy-build@example.com
      MAIL_FROM_ADDRESS: deploy-build@example.com
    outputs:
      archive_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Check out the exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          persist-credentials: false

      - name: Confirm the checkout is that SHA
        run: |
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "::error::The checkout is not the SHA that passed the guard."
            exit 1
          fi

      - name: Generate a disposable APP_KEY
        # Composer's scripts boot Laravel, which needs a key before artisan can
        # make one. This one lives for this job and is never written to a file.
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip, intl, bcmath, gd, redis
          coverage: none
          tools: composer:v2

      - name: Install locked production dependencies
        # Scripts stay ON: post-autoload-dump runs package discovery and
        # filament:upgrade, which publishes the Filament assets the archive
        # must carry.
        run: composer install --no-dev --prefer-dist --no-interaction --classmap-authoritative --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the Vite assets
        run: |
          npm ci
          npm run build

      - name: Publish and verify the Filament assets
        run: |
          php artisan filament:assets
          missing=0
          if [ ! -s public/build/manifest.json ]; then
            echo "::error::public/build/manifest.json is missing: the Vite build produced nothing."
            missing=1
          fi
          for pair in js:js css:css fonts:woff2; do
            directory=${pair%:*}
            extension=${pair#*:}
            if [ -z "$(find "public/$directory/filament" -type f -name "*.$extension" -print -quit 2> /dev/null)" ]; then
              echo "::error::No published Filament .$extension files under public/$directory/filament."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

      - name: Remove runner-generated caches
        # Package discovery wrote these. The host rebuilds its own after it
        # links its production .env, and deploy/release.sh refuses an archive
        # that carries them.
        run: |
          rm -f bootstrap/cache/*.php
          rm -f public/hot

      - name: Write the REVISION manifest
        run: printf '%s\n' "$SHA" > REVISION

      - name: Stage the release tree
        # AN ALLOWLIST, so a new dev-only top-level folder cannot ship by being
        # added. Left out on purpose: tests, docs, node_modules, storage (shared
        # on the host), .github, scripts, docker, deploy (the host runs its own
        # installed copy of release.sh, never one from the artifact) and every
        # dotfile. Composer's vendor/bin entries are symlinks on Linux, which
        # release.sh refuses, so they go; any other link fails the build.
        run: |
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          tar -cf - \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git' \
            --anchored \
            --exclude='vendor/bin' \
            --exclude='public/storage' \
            --exclude='public/hot' \
            --exclude='bootstrap/cache/*.php' \
            app artisan bootstrap composer.json composer.lock config database lang public resources routes vendor REVISION \
            | tar -xf - -C "$stage"
          if [ -n "$(find "$stage" -type l -print -quit)" ]; then
            echo "::error::The staged release tree contains a symlink; release.sh refuses archives with links."
            find "$stage" -type l -print
            exit 1
          fi

      - name: Package the release
        id: package
        run: |
          tar --hard-dereference --owner=0 --group=0 --numeric-owner --sort=name \
            -czf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/stage" .
          echo "sha256=$(sha256sum "$RUNNER_TEMP/release.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check the archive against release.sh's rules
        # The same refusals deploy/release.sh makes before it extracts anything,
        # applied here so a bad archive fails the build and not the deploy.
        run: |
          archive="$RUNNER_TEMP/release.tar.gz"
          entries="$RUNNER_TEMP/entries.txt"
          fail() { echo "::error::$1"; exit 1; }
          tar -tzf "$archive" > "$entries"
          while IFS= read -r entry; do
            entry=${entry#./}
            [[ -z "$entry" ]] && continue
            [[ "$entry" != /* && "$entry" != *\\* && ! "$entry" =~ (^|/)\.\.?(/|$) && ! "$entry" =~ [[:cntrl:]] ]] || fail 'unsafe archive path'
            case "$entry" in .env|.env.*|.env/|.env/*|*/.env|*/.env.*|.git|.git/*|storage|storage/*|node_modules|node_modules/*|tests|tests/*|docs|docs/*|public/storage|public/storage/*) fail "forbidden artifact member: $(printf '%q' "$entry")" ;; esac
            case "$entry" in bootstrap/cache/*) [[ "$entry" == bootstrap/cache/ || "$entry" == bootstrap/cache/.gitignore ]] || fail "runner-generated Laravel cache: $(printf '%q' "$entry")" ;; esac
          done < "$entries"
          tar -tvzf "$archive" > "$entries"
          while IFS= read -r line; do
            [[ "${line:0:1}" == - || "${line:0:1}" == d ]] || fail 'archive must contain regular files and directories only'
          done < "$entries"
          [ "$(tar -xzOf "$archive" ./REVISION)" = "$SHA" ] || fail 'REVISION does not contain the guarded SHA'

      - name: Upload the release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.guard.outputs.sha }}
          path: ${{ runner.temp }}/release.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: deploy
    needs: [guard, build]
    runs-on: ubuntu-latest
    # The approval gate: required reviewers are configured on this environment.
    environment: production
    # One production deploy at a time. A running deploy is never cancelled
    # mid-flight; a newer dispatch waits its turn.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Download the release archive
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.guard.outputs.sha }}
          path: ${{ runner.temp }}/download

      - name: Confirm the archive is the one that was built
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.archive_sha256 }}
        run: |
          actual=$(sha256sum "$RUNNER_TEMP/download/release.tar.gz" | cut -d' ' -f1)
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::The downloaded archive does not match the build job's checksum."
            exit 1
          fi

      - name: Install the deploy key and the pinned host key
        # The host key comes ONLY from the protected environment variable, so a
        # connection to anything else fails closed. The key and the known-hosts
        # file are removed by the last step whatever happens.
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${PROD_SSH_KEY//[[:space:]]/}" ]; then
            echo "::error::The production environment has no PROD_SSH_KEY secret."
            exit 1
          fi
          if [ -z "${KNOWN_HOSTS//[[:space:]]/}" ]; then
            echo "::error::The production environment has no PROD_SSH_KNOWN_HOSTS variable."
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/deploy-key"
          known_hosts_file="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$PROD_SSH_KEY" > "$key_file"
          printf '%s\n' "$KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          echo "KEY_FILE=$key_file" >> "$GITHUB_ENV"
          echo "KNOWN_HOSTS_FILE=$known_hosts_file" >> "$GITHUB_ENV"

      - name: Confirm main has not moved
        # Approval can take hours. If anything merged meanwhile, this SHA is no
        # longer the tip and nothing is transferred.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.guard.outputs.sha }}
        run: |
          tip=$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')
          if [ "$tip" != "$SHA" ]; then
            echo "::error::main has moved on since this deploy was dispatched ($SHA is no longer the tip). Nothing was transferred."
            exit 1
          fi

      - name: Stream the release to the host
        # ONE connection: the SHA is the only remote argument and the archive
        # is stdin. The host's forced command (deploy/receive.sh) takes it from
        # there. BatchMode and IdentitiesOnly keep ssh from prompting or trying
        # any other credential; GlobalKnownHostsFile=/dev/null leaves the
        # pinned file as the only source of host keys.
        env:
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SHA: ${{ needs.guard.outputs.sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to send anything but a full lowercase SHA."
            exit 1
          fi
          ssh -T \
            -p "$PROD_SSH_PORT" \
            -i "$KEY_FILE" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o GlobalKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            "$PROD_SSH_USER@$PROD_SSH_HOST" "$SHA" < "$RUNNER_TEMP/download/release.tar.gz"

      - name: Remove the key material
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/known_hosts"
