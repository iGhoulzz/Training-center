# The Linux development target (P35-T14). See ../../docs/LINUX-DEV-TARGET.md.
#
# Run every command from this directory:
#
#   docker compose up -d --build
#   docker compose exec app bash /bootstrap/setup.sh [branch-or-commit]
#   docker compose exec -T app composer verify
#
# Load runs and Horizon use training_center_performance, never the test
# database; setup.sh creates it. Select it per command:
#
#   docker compose exec -e DB_DATABASE=training_center_performance app php artisan ...
#
# THIS MYSQL IS ITS OWN SERVER, AND THAT IS THE WHOLE POINT
# ---------------------------------------------------------
# tests/bootstrap.php takes a machine-wide lock so two suites never rebuild one
# schema at once — and that lock DOES NOT CROSS THE OS BOUNDARY: the lock file
# lives in sys_get_temp_dir() (%TEMP% on Windows, /tmp here) and its key hashes
# a path that is spelled differently on each side. Two suites would therefore
# never see each other. The database below is a separate server inside this
# compose project, and DB_DATABASE names it distinctly as well, so a mistake in
# either direction still cannot make a Windows run and a Linux run meet.
#
# NEVER point DB_HOST at host.docker.internal. That is the one configuration
# that would undo it.
services:
    app:
        build:
            context: .
        image: training-center-dev-linux
        container_name: training_center_dev_app
        # SET NOTHING HERE THAT phpunit.xml PINS — EXCEPT DB_DATABASE, ON PURPOSE.
        #
        # PHPUnit's <env> does not override a variable that already exists. That
        # is the mechanism DB_DATABASE relies on below, and it cuts both ways: the
        # first Linux gate ran with APP_ENV=local and QUEUE_CONNECTION=redis set
        # here, so the whole suite silently ran outside the `testing` environment
        # — CSRF enforced, jobs sent to Redis instead of run — and 157 tests
        # failed for no reason in the code. APP_ENV, QUEUE_CONNECTION,
        # CACHE_STORE, SESSION_DRIVER, MAIL_MAILER and DB_CONNECTION are
        # phpunit.xml's to decide. The Redis queue this target exists for lives in
        # the container's .env (setup.sh), which PHPUnit's <env> does outrank.
        environment:
            # The SUITE's own database, distinct from the Windows one. It must be
            # a REAL environment variable, because phpunit.xml pins
            # DB_DATABASE=training_center_test and <env> does not override an
            # existing one — exactly how CI selects training_center_ci.
            #
            # Every composer verify rebuilds it with migrate:fresh, and the suite
            # lock covers test processes only. Load runs and Horizon therefore
            # override this per command with training_center_performance.
            DB_DATABASE: training_center_linux
            # Not pinned by phpunit.xml, so these are safe here.
            DB_HOST: mysql
            DB_PORT: 3306
            DB_USERNAME: root
            DB_PASSWORD: secret
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_CLIENT: phpredis
            # The same pair CI sets. .env.example supplies addresses too, so these
            # are not what makes the app boot; they keep the container's mail and
            # backup-alert settings obviously fake whatever .env holds.
            BACKUP_ALERT_EMAIL: dev@example.test
            MAIL_FROM_ADDRESS: dev@example.test
        volumes:
            # The working copy, on the Linux filesystem: fast.
            - workspace:/workspace
            # The Windows repository, read-only, as the clone source only.
            #
            # HOST_REPO MUST NAME A REAL CHECKOUT, NOT A LINKED WORKTREE. A
            # worktree's .git is a file holding a Windows path into the main
            # repository, which does not exist inside this container, so a clone
            # from one fails. The default is this file's own repository root,
            # which is right once this lands on main; while the task itself is
            # still on a branch, run compose with HOST_REPO set to the main
            # checkout — setup.sh refuses with that instruction either way.
            - ${HOST_REPO:-../..}:/host-repo:ro
            # This directory, so setup.sh is reachable whatever branch the
            # clone source happens to be on — including now, before this task
            # has merged into main.
            - .:/bootstrap:ro
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        container_name: training_center_dev_mysql
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: training_center_linux
        volumes:
            - mysql-data:/var/lib/mysql
        # No published port: nothing outside this compose project should reach
        # it, and leaving 3306 unpublished keeps it off the Windows MySQL's toes.
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-psecret']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

    redis:
        image: redis:alpine
        container_name: training_center_dev_redis
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    workspace:
    mysql-data:
